[project]
site_name = "BigXML"
site_description = "Parse big xml files and streams with ease"
site_author = "Rogdham"
repo_name = "rogdham/bigxml"
repo_url = "https://github.com/rogdham/bigxml"
site_url = "https://bigxml.rogdham.net/"
edit_uri = "blob/master/docs/src"
docs_dir = "src"
site_dir = "dist"
nav = [
    { "Home" = "index.md" },
    { "User guide" = [
        { "Quickstart" = "quickstart.md" },
        { "Recipes" = "recipes.md" },
        { "Encodings" = "encodings.md" },
        { "Namespaces" = "namespaces.md" },
        { "Typing" = "typing.md" },
        { "FAQ" = "faq.md" },
    ] },
    { "API reference" = [
        { "Parser" = "parser.md" },
        { "Streams" = "streams.md" },
        { "Handlers" = "handlers.md" },
        { "Decorators" = "decorators.md" },
        { "Nodes" = "nodes.md" },
        { "Exceptions" = "exceptions.md" },
    ] },
    { "External Links" = [
        { "Changelog" = "https://github.com/rogdham/bigxml/blob/master/CHANGELOG.md" },
        { "Issue tracker" = "https://github.com/rogdham/bigxml/issues" },
        { "BigXML @ GitHub" = "https://github.com/rogdham/bigxml" },
        { "BigXML @ PyPI" = "https://pypi.org/project/bigxml" },

    ] },
]
extra_css = ["extra.css"]

[project.theme]
variant = "modern"
language = "en"
favicon = false
features = [
    "content.code.copy",
    "navigation.expand",
    "navigation.instant",
    "navigation.instant.progress",
    "navigation.sections",
    "navigation.top",
]

[project.theme.icon]
logo = "lucide/book"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[project.extra]
generator = false

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.superfences]
